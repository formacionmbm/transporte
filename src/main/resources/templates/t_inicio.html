<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Cocheras - Inicio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-menu { transition: transform 0.3s; cursor: pointer; text-decoration: none; color: inherit; }
        .card-menu:hover { transform: scale(1.05); }
    </style>
</head>
<body>
<div class="container text-center">
    <h1 class="mb-5">Sistema de Gestión de Cocheras</h1>
    <div class="row justify-content-center">
        <div class="col-md-4">
            <a th:href="@{/l/c}" class="card card-menu shadow p-4 bg-primary text-white">
                <h3>🔍 Listado</h3>
                <p>Consultar y filtrar cocheras existentes</p>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/r/c}" class="card card-menu shadow p-4 bg-success text-white">
                <h3>📝 Registro</h3>
                <p>Dar de alta una nueva cochera</p>
            </a>
        </div>
    </div>
</div>
</body>
</html>
