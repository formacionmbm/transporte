<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscador de Conductores</title>
</head>
<body>
<h1>Buscador de Conductores</h1>

<form th:action="@{/buscador/numEmple}" method="get">
    <label for="numEmple">Número de Empleado:</label>
    <input type="text" id="numEmple" name="numEmple" th:value="${numEmple}">
    <button type="submit">Buscar</button>
</form>

<form th:action="@{/buscador}" method="get" style="margin-top: 10px;">
    <button type="submit">Mostrar todos los conductores</button>
</form>

<div th:if="${conductorDTO != null}">
    <h2>Conductor Encontrado:</h2>
    <p>Nombre: <span th:text="${conductorDTO.nombre}"></span></p>
    <p>Apellido: <span th:text="${conductorDTO.apellidos}"></span></p>
    <p>Número de Empleado: <span th:text="${conductorDTO.numEmpleado}"></span></p>
    <p>Estado: <span th:text="${conductorDTO.estadoConductor}"></span></p>
</div>

<div th:if="${conductorDTO == null and numEmple != null}">
    <p>No se encontró ningún conductor con el número <b th:text="${numEmple}"></b>.</p>
</div>

<div th:if="${list != null}">
    <h2>Lista de Conductores:</h2>
    <ul>
        <li th:each="c : ${list}">
            <span th:text="${c.numEmpleado}"></span> -
            <span th:text="${c.nombre}"></span>
            <span th:text="${c.apellidos}"></span> -
            <span th:text="${c.estadoConductor}"></span>
        </li>
    </ul>
</div>
</body>
</html>
