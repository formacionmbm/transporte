<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear nuevo Abono Transporte</title>
</head>
<body>
<div style="
        border: 2px solid #333;
        padding: 20px;
        border-radius: 10px;
        width: fit-content;
        box-shadow: 0px 4px 8px rgba(0,0,0,0.1);">

    <h2>Formulario Abono Trasporte</h2>

    <form name="formcrear" th:action="@{/at/format}" th:object="${at}" method="post">
        <input type="hidden" th:field="*{id}">

        <div>
            <label th:text="#{tipos}"></label>
            <select th:field="*{estado}">
                <option value=""></option>
                <option th:each="est:${estados}" th:value="${est}" th:text="${est}"></option>
            </select>
        </div><br>
        <div>
            <label>Descuento: </label>
            <input type="text" th:field="*{raza}">
        </div><br>
        <div>
            <label>Billete: </label>
            <input type="number" th:field="*{edad}">
        </div><br>
        <div>
            <fieldset>
                <legend>Validez: </legend>
                <input type="radio" id="macho" th:field="*{sexo}" value="MACHO">
                <label for="macho">Macho</label>
                <input type="radio" id="hembra" th:field="*{sexo}" value="HEMBRA">
                <label for="hembra">Hembra</label>
            </fieldset>
        </div><br>
        <div>
            <label>Activo: </label>
            <input type="number" step="0.01" th:field="*{peso}">
        </div><br>
        <div>
            <label th:text="#{estado}"></label>
            <select th:field="*{estado}">
                <option value=""></option>
                <option th:each="est:${estados}" th:value="${est}" th:text="${est}"></option>
            </select>
        </div><br>
        <div>
            <label>Precio: </label>
            <input type="date" th:field="*{fechaIngreso}">
        </div><br>

        <button>💾 Guardar</button>

        <input type="reset" value="⚪️ Limpiar Formulario">
    </form>
</div>
</body>
</html>
