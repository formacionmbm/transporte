<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Cocheras</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2>Listado de Cocheras</h2>
<hr>

<form th:action="@{/l/c}" method="get" class="row g-3 mb-4">
    <div class="col-md-4">
        <input type="text" name="localidad" class="form-control" placeholder="Filtrar por localidad">
    </div>
    <div class="col-md-4">
        <select name="estado" class="form-select">
            <option value="">Todos los estados</option>
            <option th:each="est : ${T(com.practica.transporte.commons.EstadoCochera).values()}"
                    th:value="${est}" th:text="${est}"></option>
        </select>
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-secondary w-100">Filtrar</button>
    </div>
    <div class="col-md-2">
        <a th:href="@{/l/c}" class="btn btn-outline-dark w-100">Limpiar</a>
    </div>
</form>

<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Localidad</th>
        <th>Capacidad</th>
        <th>Ocupación</th>
        <th>Estado</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${listaCocheras}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.nombre}"></td>
        <td th:text="${c.localidad}"></td>
        <td th:text="${c.plazasTotales}"></td>
        <td th:text="${c.plazasOcupadas}"></td>
        <td>
                    <span th:text="${c.estado}"
                          th:classappend="${c.estado.name() == 'ACTIVA' ? 'badge bg-success' : (c.estado.name() == 'EN_OBRAS' ? 'badge bg-warning' : 'badge bg-danger')}">
                    </span>
        </td>
    </tr>
    </tbody>
</table>
<a th:href="@{/inicio}" class="btn btn-link">Volver al inicio</a>
</body>
</html>
