<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Cochera</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="row justify-content-center">
    <div class="col-md-6 border p-4 shadow-sm bg-white">
        <h3>Nueva Cochera</h3>
        <p class="text-muted">Rellene los datos para dar de alta en el sistema</p>
        <hr>
        <form th:action="@{/r/c}" th:object="${cochera}" method="post">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Dirección</label>
                <input type="text" th:field="*{direccion}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Localidad / CP</label>
                <input type="text" th:field="*{localidad}" class="form-control" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Plazas Totales</label>
                    <input type="number" th:field="*{plazasTotales}" class="form-control" min="1" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Estado Inicial</label>
                    <select th:field="*{estado}" class="form-select">
                        <option th:each="est : ${T(com.practica.transporte.commons.EstadoCochera).values()}"
                                th:value="${est}" th:text="${est}"></option>
                    </select>
                </div>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success">Guardar Cochera</button>
                <a th:href="@{/inicio}" class="btn btn-light">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
